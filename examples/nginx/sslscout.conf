# Example nginx vhost serving the static SSLScout dashboard.
#
#   sudo install -m 0644 examples/nginx/sslscout.conf \
#        /etc/nginx/conf.d/sslscout.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSLScout does not need to be running for the dashboard to work: nginx only
# serves the static files (index.html + report.json) that the scheduled run
# leaves in /opt/sslscout/public.
#
# For the containerized equivalent, see examples/docker/nginx.conf and the
# docker-compose.yml in the repository root.

server {
    listen 80;
    server_name sslscout.internal.example.com;

    root /opt/sslscout/public;
    index index.html;

    # The dashboard has no authentication of its own. Restrict access.
    # Option 1 — by network:
    #   allow 10.0.0.0/8;
    #   deny  all;
    #
    # Option 2 — HTTP basic auth:
    #   auth_basic           "SSLScout";
    #   auth_basic_user_file /etc/nginx/sslscout.htpasswd;

    location = /report.json {
        # The report is rewritten on every run; it must never be cached.
        # These are add_header rather than "expires -1" because expires emits a
        # Cache-Control of its own, and the response would carry two of them.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
