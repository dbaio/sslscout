# nginx site used by the "web" service of docker-compose.yml.
#
# It only publishes static files: index.html and the report.json that the
# sslscout container writes into the shared volume. There is no proxying, no
# backend, no dynamic anything.
#
# Mounted at /etc/nginx/conf.d/default.conf, replacing the image default.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # The dashboard has no authentication of its own. If you publish this
    # beyond localhost, restrict it here — by network:
    #   allow 10.0.0.0/8;
    #   deny  all;
    # or with HTTP basic auth (mount the file into the container):
    #   auth_basic           "SSLScout";
    #   auth_basic_user_file /etc/nginx/sslscout.htpasswd;

    # No directory listings, and no leaking of the nginx version.
    autoindex off;
    server_tokens off;

    location = /report.json {
        # The report is rewritten on every run; it must never be cached.
        # These are add_header rather than "expires -1" because expires emits a
        # Cache-Control of its own, and the response would carry two of them.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type application/json;
    }

    location = /index.html {
        # Single-file dashboard: revalidate so a redeploy shows up right away.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # A container-local health check that does not touch the report.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
