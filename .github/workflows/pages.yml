name: Publish the dashboard to GitHub Pages

# Runs SSLScout on the runner, generates public/report.json and publishes the
# public/ directory to GitHub Pages.
#
# Repository prerequisites:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The "Configure Pages" step below passes enablement: true, so it also creates
# the Pages site on the first run when the setting has never been saved --
# without it the action fails with "Get Pages site failed ... Not Found".
#
# Warning: the published dashboard is PUBLIC if the repository is public. Do
# not use this workflow with a list of internal domains that must not leak.
on:
  workflow_dispatch:
  schedule:
    # Every week.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Build
        run: go build -o sslscout ./cmd/sslscout

      - name: Generate report.json
        # -notify=false makes sure no alert is ever fired from CI.
        run: ./sslscout -notify=false -out public/report.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site if it does not exist yet.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
